name: Build ykneo-oath CAP file

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # 允许网页端手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download Java Card SDK 2.2.2
      run: |
        git clone https://github.com/martinpaljak/oracle_javacard_sdks.git
        echo "JC_HOME=$PWD/oracle_javacard_sdks/jc222_kit" >> $GITHUB_ENV
        echo "JC222=$PWD/oracle_javacard_sdks/jc222_kit" >> $GITHUB_ENV

    - name: Build with Ant
      run: ant

    - name: Upload CAP file artifact
      uses: actions/upload-artifact@v4
      with:
        name: ykneo-oath-cap
        # 自动扫描并打包当前目录下生成的所有 .cap 文件
        path: '**/*.cap'
        retention-days: 7
