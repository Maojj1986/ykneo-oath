name: Build ykneo-oath CAP file

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # 允许你在网页端手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download Java Card SDK 2.2.2
      run: |
        # 下载开源社区维护的 Oracle Java Card 历史 SDK 包
        git clone https://github.com/martinpaljak/oracle_javacard_sdks.git
        # 根据 ykneo-piv build.xml 的需求，可能需要设置环境变量
        echo "JC_HOME=$PWD/oracle_javacard_sdks/jc222_kit" >> $GITHUB_ENV
        echo "JC222=$PWD/oracle_javacard_sdks/jc222_kit" >> $GITHUB_ENV

    - name: Build with Ant
      run: ant build # 如果 build.xml 的默认 target 不是 build，可以直接写 ant

    - name: Upload CAP file artifact
      uses: actions/upload-artifact@v3
      with:
        name: ykneo-oath-cap
        # 自动抓取生成的所有 .cap 文件
        path: '**/*.cap'
        retention-days: 7
