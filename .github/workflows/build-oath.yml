name: Build ykneo-oath CAP file

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download Java Card SDK 2.2.2
      run: |
        git clone https://github.com/martinpaljak/oracle_javacard_sdks.git

    - name: Build with Ant
      run: ant -DJAVACARD_HOME=$PWD/oracle_javacard_sdks/jc222_kit

    - name: Upload CAP file artifact
      uses: actions/upload-artifact@v4
      with:
        name: ykneo-oath-cap
        path: '**/*.cap'
        retention-days: 7
